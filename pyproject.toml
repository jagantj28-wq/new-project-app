[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farmtwin"
version = "1.0.0"
description = "Precision Agriculture Digital Twin & Micro-Climate Simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
